<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#132b45" />
      <stop offset="60%" stop-color="#0c1929" />
      <stop offset="100%" stop-color="#07101b" />
    </radialGradient>

    <!-- Shield & Leaf Gradients -->
    <linearGradient id="shieldGrad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#0575e6" />
    </linearGradient>

    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#43e97b" />
      <stop offset="60%" stop-color="#38f9d7" />
      <stop offset="100%" stop-color="#00e5ff" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Canvas Container with Rounded Borders -->
  <rect width="500" height="500" rx="90" fill="url(#bgGrad)" />
  <rect width="496" height="496" x="2" y="2" rx="88" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- Shield Base (Left Wing) -->
  <path d="M 160 145 C 195 140, 235 125, 250 115 C 255 125, 270 135, 290 140 C 275 220, 240 280, 175 305 C 160 250, 150 190, 160 145 Z"
        fill="none" stroke="url(#shieldGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" opacity="0.92" filter="url(#glow)" />

  <!-- Leaf Base (Right Wing) -->
  <path d="M 250 115 C 290 130, 320 180, 310 240 C 300 280, 260 315, 215 320 C 235 270, 245 200, 250 115 Z"
        fill="url(#leafGrad)" opacity="0.82" filter="url(#glow)" />

  <!-- Inner Leaf Vein Line -->
  <path d="M 250 125 Q 265 210 225 295" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="4" stroke-linecap="round" />

  <!-- Heartbeat ECG Pulse into Neural Network -->
  <!-- Pulse Line -->
  <path d="M 120 215 L 148 215 L 165 175 L 182 250 L 198 190 L 210 215 L 222 215" 
        fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)" />

  <!-- Neural Network Interconnected Nodes (Brain / AI Network) -->
  <g stroke="#ffffff" stroke-width="5" opacity="0.95" filter="url(#glow)">
    <!-- Links -->
    <line x1="222" y1="215" x2="242" y2="185" />
    <line x1="222" y1="215" x2="250" y2="242" />
    <line x1="242" y1="185" x2="278" y2="175" />
    <line x1="242" y1="185" x2="272" y2="218" />
    <line x1="250" y1="242" x2="272" y2="218" />
    <line x1="278" y1="175" x2="305" y2="198" />
    <line x1="272" y1="218" x2="305" y2="198" />
    <line x1="250" y1="242" x2="252" y2="272" />
  </g>

  <!-- Node Circles -->
  <g fill="#ffffff" filter="url(#softGlow)">
    <circle cx="222" cy="215" r="8" />
    <circle cx="242" cy="185" r="10" />
    <circle cx="250" cy="242" r="7" />
    <circle cx="278" cy="175" r="9" />
    <circle cx="272" cy="218" r="8" />
    <circle cx="305" cy="198" r="11" />
    <circle cx="252" cy="272" r="11" />
  </g>

  <!-- Brand Typography: HealthGPT -->
  <text x="250" y="398" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="54" fill="#ffffff" letter-spacing="-0.5">
    HealthGP<tspan fill="#38bdf8" filter="url(#glow)">T</tspan>
  </text>

  <!-- Glowing Medical Spark Over 'T' -->
  <g transform="translate(372, 362)">
    <circle cx="0" cy="0" r="5" fill="#38bdf8" filter="url(#softGlow)" />
    <path d="M 0 -8 L 0 8 M -8 0 L 8 0" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Slogan: Where AI Meets HealthCare -->
  <text x="250" y="438" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="18" fill="#5eead4" letter-spacing="3.2">
    WHERE AI MEETS HEALTHCARE
  </text>
</svg>
