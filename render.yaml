services:
  - type: web
    name: healthgpt
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.application:application --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: SESSION_SECRET
        generateValue: true
